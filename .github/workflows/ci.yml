name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/publication_guard.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install media tools for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools par2
      - run: cargo test --locked
      - name: Exercise exact recovery through HTTP and synthetic NNTP
        run: |
          cargo build --locked
          python3 tests/recovery_e2e.py --binary target/debug/velvet-backend --par2 /usr/bin/par2

  portable-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test clients/android/tests/sports-startup.test.cjs
      - run: node --test clients/ios/Tests/sports-playback-startup.test.mjs
      - run: npm test
        working-directory: tve/spectrum
      - run: npm ci && npm test && npm run build
        working-directory: clients/roku

  seasonal-contract:
    name: seasonal-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native client compilers
        run: |
          java -version
          command -v swiftc
          swiftc --version
      - name: Seasonal Rust contract and real backend binary
        run: |
          cargo test --locked --manifest-path backend/Cargo.toml seasonal
          cargo build --locked --manifest-path backend/Cargo.toml
      - name: Authenticated HTTP contract and hot mounted manifest reload
        run: python3 backend/tests/seasonal_e2e.py --binary backend/target/debug/velvet-backend
      - name: Production Kotlin and Swift clients against real HTTP backend
        run: python3 scripts/seasonal_contract.py --binary backend/target/debug/velvet-backend --download-tools
      - name: Kotlin JVM seasonal regression tests
        run: python3 clients/android/tests/seasonal-jvm.py --tools-dir "$TMPDIR/seasonal-kotlin-tools"
      - name: Swift production-source seasonal regression tests
        run: |
          python3 clients/ios/scripts/test-seasonal.py
          python3 clients/ios/scripts/test-seasonal.py --foreground
          python3 clients/ios/scripts/test-seasonal-integration.py
      - name: Build pinned pre-migration backend for real rollback
        run: |
          git fetch --no-tags origin f30050f65aab1e5582d4cf11e14ad7cb1d4c6bce
          mkdir -p "$RUNNER_TEMP/seasonal-legacy"
          git archive f30050f65aab1e5582d4cf11e14ad7cb1d4c6bce backend | tar -x -C "$RUNNER_TEMP/seasonal-legacy"
          cargo build --locked --manifest-path "$RUNNER_TEMP/seasonal-legacy/backend/Cargo.toml" --target-dir "$RUNNER_TEMP/seasonal-legacy-target"
      - name: Pinned legacy requests and same-database upgrade rollback
        run: python3 backend/tests/legacy_compat.py --binary backend/target/debug/velvet-backend --baseline-binary "$RUNNER_TEMP/seasonal-legacy-target/debug/velvet-backend"
