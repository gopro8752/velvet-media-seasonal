name: Seasonal iOS settings regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ios-seasonal-settings:
    # Standard hosted runner for this public repository; no paid/larger runner.
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real Apple Combine subscription and seasonal task lifecycle
        run: python3 clients/ios/scripts/test-seasonal-settings.py
